<!DOCTYPE html>
<html lang="pt">

<head>
  <meta charset="UTF-8" />
  <title>NotifyIt</title>

  <link rel="stylesheet" href="src/style.css">

  <style>
    :root {
      --bg: #0b1220;
      --text: #e5e7eb;
      --muted: #9ca3af;
      --accent: #3b82f6;
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: system-ui, sans-serif;
      background: radial-gradient(circle at top, #111827, #0b1220);
      color: var(--text);
    }

    /* HERO */

    .hero {
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
      padding: 40px 20px;
    }

    .badge {
      font-size: 12px;
      color: var(--muted);
      margin-bottom: 10px;
    }

    h1 {
      font-size: 48px;
      margin: 0;
      font-weight: 700;
    }

    .subtitle {
      margin-top: 10px;
      font-size: 16px;
      color: var(--muted);
      max-width: 520px;
    }

    /* DEMO */

    .demo {
      margin-top: 40px;
      display: grid;
      grid-template-columns: repeat(3, 170px);
      gap: 12px;
    }

    .demo button {
      padding: 12px;
      border-radius: 10px;
      border: 1px solid rgba(255, 255, 255, 0.12);
      background: rgba(255, 255, 255, 0.06);
      color: var(--text);
      cursor: pointer;
      transition: 0.2s;
      font-size: 14px;
    }

    .demo button:hover {
      background: rgba(255, 255, 255, 0.12);
      transform: translateY(-1px);
    }

    .primary {
      background: linear-gradient(135deg, #3b82f6, #2563eb);
      border: none;
    }

    .primary:hover {
      transform: translateY(-2px);
    }

    /* CONTROLS */

    .controls {
      margin-top: 40px;
      display: flex;
      gap: 10px;
      flex-wrap: wrap;
      justify-content: center;
    }

    select {
      padding: 8px 10px;
      border-radius: 8px;
      border: 1px solid rgba(255, 255, 255, 0.12);
      background: rgba(255, 255, 255, 0.06);
      color: var(--text);
    }

    .foot {
      margin-top: 30px;
      font-size: 12px;
      color: var(--muted);
    }
  </style>
</head>

<body>

  <div class="hero">

    <div class="badge">Lightweight • Promise-based • Clean API</div>

    <h1>NotifyIt</h1>

    <div class="subtitle">
      Toast notifications inspired by modern UX.<br>
      Minimal styles. Powerful behavior.
    </div>

    <!-- DEMO -->
    <div class="demo">

      <button onclick="NotifyIt.success('Saved successfully')">Success</button>
      <button onclick="NotifyIt.error('Something failed')">Error</button>
      <button onclick="NotifyIt.warning('Be careful')">Warning</button>

      <button onclick="NotifyIt.info('Heads up')">Info</button>

      <button onclick="NotifyIt.show({
      title: 'Default',
      message: 'Simple toast without type'
    })">Default</button>

      <button onclick="NotifyIt.show({
      title: 'New message',
      message: 'You have a new notification'
    })">Rich</button>

      <button onclick="testPromiseSuccess()">Promise OK</button>
      <button onclick="testPromiseError()">Promise Fail</button>

      <button class="primary" onclick="spam()">Spam 🔥</button>

    </div>

    <!-- CONTROLS -->
    <div class="controls">

      <select id="position">
        <option value="top-right">Top Right</option>
        <option value="top-left">Top Left</option>
        <option value="bottom-right">Bottom Right</option>
        <option value="bottom-left">Bottom Left</option>
        <option value="top-center">Top Center</option>
        <option value="bottom-center">Bottom Center</option>
      </select>

      <!-- CORE STYLE -->
      <select id="mode">
        <option value="solid">Solid</option>
        <option value="mono">Mono</option>
        <option value="rich">Rich</option>
      </select>

      <select id="duration">
        <option value="2000">2s</option>
        <option value="4000" selected>4s</option>
        <option value="8000">8s</option>
        <option value="0">Sticky</option>
      </select>

    </div>

    <div class="foot">
      Change style → trigger → observe behavior
    </div>

  </div>

  <script type="module">
    import NotifyIt from './src/index.js';

    NotifyIt.init({
      position: 'top-right',
      duration: 4000,
      max: 5,
      closable: true,
      pauseOnHover: true,
      mode: 'solid',
      effect: '',
      layout: 'default',
      icon: true
    });

    window.NotifyIt = NotifyIt;

    // live config
    document.querySelectorAll('select').forEach(el => {
      el.addEventListener('change', () => {
        NotifyIt.config({
          position: document.getElementById('position').value,
          mode: document.getElementById('mode').value,
          duration: Number(document.getElementById('duration').value)
        });
      });
    });

    // PROMISES

    window.testPromiseSuccess = () => {
      const p = new Promise(res => setTimeout(() => res("Data loaded"), 2000));

      NotifyIt.promise(p, {
        loading: "Loading...",
        success: (r) => `Success: ${r}`
      });
    };

    window.testPromiseError = () => {
      const p = new Promise((_, rej) => setTimeout(() => rej("Network error"), 2000));

      NotifyIt.promise(p, {
        loading: "Requesting...",
        error: (e) => `Error: ${e}`
      }).catch(() => { });
    };

    // stress test

    window.spam = () => {
      for (let i = 0; i < 5; i++) {
        setTimeout(() => {
          NotifyIt.show({
            title: "Batch",
            message: "Toast " + (i + 1)
          });
        }, i * 120);
      }
    };
  </script>

</body>

</html>
