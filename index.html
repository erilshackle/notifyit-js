<!DOCTYPE html>
<html lang="pt">
<head>
  <meta charset="UTF-8" />
  <title>NotifyIt</title>

  <link rel="stylesheet" href="src/style.css">

  <style>
    :root {
      --bg: #0b1220;
      --text: #e5e7eb;
      --muted: #9ca3af;
      --accent: #3b82f6;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      font-family: system-ui, sans-serif;
      background: radial-gradient(circle at top, #111827, #0b1220);
      color: var(--text);
    }

    /* ---------------------------------- */
    /* HERO */
    /* ---------------------------------- */

    .hero {
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
      padding: 40px 20px;
    }

    .badge {
      font-size: 12px;
      color: var(--muted);
      margin-bottom: 10px;
    }

    h1 {
      font-size: 48px;
      margin: 0;
      font-weight: 700;
    }

    .subtitle {
      margin-top: 10px;
      font-size: 16px;
      color: var(--muted);
      max-width: 520px;
    }

    /* ---------------------------------- */
    /* BUTTON GRID (DEMO) */
    /* ---------------------------------- */

    .demo {
      margin-top: 40px;
      display: grid;
      grid-template-columns: repeat(3, 160px);
      gap: 12px;
    }

    .demo button {
      padding: 12px;
      border-radius: 10px;
      border: 1px solid rgba(255,255,255,0.12);
      background: rgba(255,255,255,0.06);
      color: var(--text);
      cursor: pointer;
      transition: 0.2s;
      font-size: 14px;
    }

    .demo button:hover {
      background: rgba(255,255,255,0.12);
      transform: translateY(-1px);
    }

    .primary {
      background: linear-gradient(135deg, #3b82f6, #2563eb);
      border: none;
    }

    .primary:hover {
      transform: translateY(-2px);
    }

    /* ---------------------------------- */
    /* CONFIG INLINE */
    /* ---------------------------------- */

    .controls {
      margin-top: 40px;
      display: flex;
      gap: 10px;
      flex-wrap: wrap;
      justify-content: center;
    }

    select {
      padding: 8px 10px;
      border-radius: 8px;
      border: 1px solid rgba(255,255,255,0.12);
      background: rgba(255,255,255,0.06);
      color: var(--text);
    }

    /* ---------------------------------- */
    /* FOOT */
    /* ---------------------------------- */

    .foot {
      margin-top: 30px;
      font-size: 12px;
      color: var(--muted);
    }
  </style>
</head>

<body>

<div class="hero">

  <div class="badge">Lightweight • Zero deps • Promise-ready</div>

  <h1>NotifyIt</h1>

  <div class="subtitle">
    Elegant toast notifications for modern apps.<br>
    Clean API. Smooth animations. Zero nonsense.
  </div>

  <!-- DEMO BUTTONS -->
  <div class="demo">

    <button onclick="NotifyIt.success('Success')">Success</button>
    <button onclick="NotifyIt.error('Error')">Error</button>
    <button onclick="NotifyIt.warning('Warning')">Warning</button>

    <button onclick="NotifyIt.info('Info')">Info</button>
    <button onclick="NotifyIt.show({ message: 'Default toast' })">Default</button>
    <button onclick="NotifyIt.clear()">Clear</button>

    <button onclick="testPromiseSuccess()">Promise OK</button>
    <button onclick="testPromiseError()">Promise Fail</button>

    <button class="primary" onclick="spam()">Spam 🔥</button>

  </div>

  <!-- CONTROLS -->
  <div class="controls">
    <select id="position">
      <option value="top-right">Top Right</option>
      <option value="top-left">Top Left</option>
      <option value="bottom-right">Bottom Right</option>
      <option value="bottom-left">Bottom Left</option>
      <option value="top-center">Top Center</option>
      <option value="bottom-center">Bottom Center</option>
    </select>

    <select id="appearance">
      <option value="elevated">Elevated</option>
      <option value="outline">Outline</option>
      <option value="solid">Solid</option>
      <option value="glass">Glass</option>
      <option value="gradient">Gradient</option>
      <option value="subtle">Subtle</option>
    </select>

    <select id="duration">
      <option value="2000">2s</option>
      <option value="4000" selected>4s</option>
      <option value="8000">8s</option>
      <option value="0">Sticky</option>
    </select>
  </div>

  <div class="foot">
    Try changing options and clicking buttons ↑
  </div>

</div>

<script type="module">
  import NotifyIt from './src/index.js';

  NotifyIt.init({
    position: 'top-right',
    duration: 4000,
    max: 5,
    closable: true,
    pauseOnHover: true,
    appearance: 'elevated',
    layout: 'default',
    icon: true
  });

  window.NotifyIt = NotifyIt;

  // live config (auto apply)
  document.querySelectorAll('select').forEach(el => {
    el.addEventListener('change', () => {
      NotifyIt.config({
        position: document.getElementById('position').value,
        appearance: document.getElementById('appearance').value,
        duration: Number(document.getElementById('duration').value)
      });
    });
  });

  // ------------------
  // PROMISE DEMO
  // ------------------

  window.testPromiseSuccess = () => {
    const p = new Promise(res => setTimeout(() => res("Loaded data"), 2000));

    NotifyIt.promise(p, {
      loading: "Loading...",
      success: (r) => `Success: ${r}`
    });
  };

  window.testPromiseError = () => {
    const p = new Promise((_, rej) => setTimeout(() => rej("Fail"), 2000));

    NotifyIt.promise(p, {
      loading: "Requesting...",
      error: (e) => `Error: ${e}`
    }).catch(()=>{});
  };

  // stress test
  window.spam = () => {
    for (let i = 0; i < 5; i++) {
      setTimeout(() => {
        NotifyIt.show({ message: "Toast " + (i + 1) });
      }, i * 120);
    }
  };
</script>

</body>
</html>
